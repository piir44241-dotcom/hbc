<style>
/* Layout idea: a bank passbook — summary tiles on top, a ruled ledger underneath, receipts printed in gold-edged slips. */
:root{
  --bg:#f3f3f4; --surface:#ffffff; --ink:#141414; --muted:#5f6268; --line:#e1e2e5;
  --accent:#c8102e; --accent-soft:#fbe8eb; --gold:#8e0b20; --brand-dark:#141414; --on-dark:#ffffff;
  --good:#18794e; --warn:#b4630b; --bad:#c8102e; --info:#2c5ea8; --on-accent:#ffffff;
  --radius:14px; --shadow:0 1px 2px rgba(20,20,20,.05),0 4px 14px rgba(20,20,20,.05);
  --font-display:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;
  --font-body:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f0f10; --surface:#1a1a1c; --ink:#ececee; --muted:#a0a2a8; --line:#2c2c30;
    --accent:#ff4d63; --accent-soft:#3a1219; --gold:#ff8a99; --brand-dark:#000000; --on-dark:#ffffff;
    --good:#4cc38a; --warn:#f0a23b; --bad:#ff5d6f; --info:#7aa7ef; --on-accent:#ffffff; color-scheme:dark;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55}
h1,h2,h3{font-family:var(--font-display);font-weight:700;text-wrap:balance;margin:0}
h1{font-size:1.3rem;line-height:1.2} h2{font-size:1.15rem} h3{font-size:1rem}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.num{font-variant-numeric:tabular-nums}
header.top{background:var(--brand-dark);color:var(--on-dark);position:sticky;top:0;z-index:5;border-bottom:3px solid var(--accent);padding-top:env(safe-area-inset-top)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px 0;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand-id{display:flex;align-items:center;gap:12px;min-width:0;text-decoration:none;color:inherit}
.brand-logo{width:46px;height:46px;flex:none;display:block;filter:drop-shadow(0 0 1px rgba(255,255,255,.35))}
.brand h1{color:#fff;letter-spacing:.01em}
.brand small{color:#c9c9cc;display:block;font-size:.8rem;letter-spacing:.04em}
.role{font-size:.76rem;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.1);color:#fff;font-weight:600;border:1px solid rgba(255,255,255,.18)}
header.top .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.28)}
header.top .btn:hover{border-color:#fff;background:rgba(255,255,255,.08)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{padding:9px 13px;text-decoration:none;color:#bdbdc2;border-bottom:3px solid transparent;white-space:nowrap;font-weight:600;margin-bottom:-3px}
nav.tabs a:hover{color:#fff}
nav.tabs a[aria-current="page"]{color:#fff;border-color:var(--accent)}
nav.bottom{display:none}
main{max-width:1180px;margin:0 auto;padding:20px 16px 60px;display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.narrow{max-width:520px;margin:30px auto;width:100%;display:flex;flex-direction:column;gap:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;border-top:4px solid var(--line);box-shadow:var(--shadow);min-width:0}
.tile .l{color:var(--muted);font-size:.85rem}
.tile .v{font-size:1.45rem;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile .s{color:var(--muted);font-size:.8rem}
.tile.main{border-top-color:var(--accent);background:linear-gradient(160deg,var(--surface) 55%,var(--accent-soft))} .tile.warn{border-top-color:var(--warn)} .tile.gold{border-top-color:var(--ink)} .tile.info{border-top-color:var(--info)} .tile.bad{border-top-color:var(--bad)}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:500;text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.6;cursor:wait}
.btn.p{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.sm{padding:3px 9px;font-size:.85rem}
.btn.danger{color:var(--bad)}
.btn.p.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top}

td.r,th.r{text-align:right}
.chip{display:inline-block;font-size:.76rem;padding:1px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap;font-weight:600}
.c-good{color:var(--good)} .c-warn{color:var(--warn)} .c-bad{color:var(--bad)} .c-info{color:var(--info)} .c-muted{color:var(--muted)} .c-gold{color:var(--gold)} .c-acc{color:var(--accent)}
.muted{color:var(--muted)} .small{font-size:.85rem}
.alert{background:var(--surface);border-radius:8px;padding:10px 12px;border:1px solid var(--line);border-left:4px solid var(--warn)}
.alert.bad{border-left-color:var(--bad)} .alert.good{border-left-color:var(--good)} .alert.info{border-left-color:var(--info)}
.grid-months{display:grid;gap:4px}
.cell{border-radius:5px;padding:4px 2px;text-align:center;font-size:.78rem;font-weight:600;min-width:58px}
.cell.paid{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.cell.partial{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.cell.late{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.cell.pending{background:color-mix(in srgb,var(--info) 14%,transparent);color:var(--info)}
.cell.future,.cell.na{color:var(--muted);background:transparent;border:1px dashed var(--line)}

#modal.open{display:flex}

.dlg.wide{max-width:860px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.form .full{grid-column:1/-1}
@media (max-width:520px){.form{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:3px;font-size:.86rem;color:var(--muted)}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 11px;color:var(--ink);font-size:1rem;min-height:42px}
label.cb{display:flex;gap:6px;align-items:center;font-size:.9rem}
textarea{min-height:70px;resize:vertical}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:flex;gap:5px;align-items:center;border:1px solid var(--line);border-radius:7px;padding:4px 9px;color:var(--ink);font-size:.88rem;cursor:pointer}
.proofs{display:flex;gap:6px;flex-wrap:wrap}
.receipt-img{width:100%;border-radius:8px;border:1px solid var(--line)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:30;font-size:.92rem;max-width:90vw}
.doc h2{margin:18px 0 6px;font-size:1.1rem}
.doc p{margin:6px 0;max-width:70ch}
.doc ul{margin:4px 0 4px 18px;padding:0;max-width:70ch}
.steps{display:flex;flex-direction:column;gap:10px}
.step{display:grid;grid-template-columns:34px 1fr;gap:10px}
.step b.n{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700}
.step.now b.n{background:var(--accent);color:var(--on-accent)}
svg text{fill:var(--muted);font-family:var(--font-body);font-size:11px}
.loading{padding:40px;text-align:center;color:var(--muted)}
code{background:var(--accent-soft);padding:1px 5px;border-radius:4px;font-size:.88em;word-break:break-all}
.more-sheet{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.more-sheet a,.more-sheet button{display:flex;align-items:center;gap:10px;padding:14px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink);background:var(--bg);font-weight:600;text-align:left;cursor:pointer}
.more-sheet a[aria-current="page"]{border-color:var(--accent);color:var(--accent)}
.foot{max-width:1180px;margin:0 auto;padding:0 16px 30px;color:var(--muted);font-size:.8rem;text-align:center}
@media (max-width:720px){
  body{font-size:15px}
  .top-in{padding:8px 12px 8px}
  .brand{flex-wrap:nowrap}
  .brand-logo{width:38px;height:38px}
  .brand h1{font-size:1.02rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand small{display:none}
  .brand .role{display:none}
  #hdrBtns{display:none}
  nav.tabs{display:none}
  nav.bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(0,0,0,.06)}
  nav.bottom a,nav.bottom button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:.72rem;font-weight:600;color:var(--muted);text-decoration:none;background:none;border:0;cursor:pointer;border-radius:10px}
  nav.bottom svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  nav.bottom [aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
  main{padding:14px 12px calc(96px + env(safe-area-inset-bottom));gap:14px}
  .card{padding:14px;border-radius:12px}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .tile{padding:10px 12px}
  .tile .v{font-size:1.12rem}
  .tile .l{font-size:.78rem}
  .tile .s{font-size:.72rem}
  table{font-size:.86rem}
  th,td{padding:7px 5px}
  .card-h{margin-bottom:8px}
  #modal{padding:0;align-items:stretch}
  .dlg{border-radius:0;max-width:none;min-height:100%;padding:16px 14px calc(20px + env(safe-area-inset-bottom));border:0}
  .dlg .row:last-child .btn{flex:1;text-align:center;padding:11px}
  .btn{padding:9px 13px}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom))}
  .foot{padding-bottom:100px}
}
@media (max-width:360px){ .tiles{grid-template-columns:1fr} }
@media (max-width:720px){
  table.rt thead{display:none}
  table.rt, table.rt tbody{display:block}
  table.rt tr{display:block;border:1px solid var(--line);border-radius:12px;padding:6px 10px;margin:0 0 10px;background:var(--surface)}
  table.rt td{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border:0;border-bottom:1px dashed var(--line);padding:6px 0;text-align:right}
  table.rt td:last-child{border-bottom:0}
  table.rt td::before{content:attr(data-label);color:var(--muted);font-size:.78rem;font-weight:600;text-align:left;flex:none;max-width:45%}
  table.rt td:not([data-label])::before,table.rt td[data-label=""]::before{content:none}
  table.rt td > *{max-width:62%}
  table.rt tfoot{display:block} table.rt tfoot tr{display:flex;justify-content:space-between;flex-wrap:wrap}
  .tbl-wrap:has(table.rt){overflow:visible}
}
@media print{ header.top,nav.bottom,#hdrBtns,.btn,.foot{display:none!important} body{background:#fff} .card{box-shadow:none} }
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
"use strict";
/* =========================================================================
   পঞ্চবন্ধু তহবিল — GitHub Pages সংস্করণ
   হেক্সাবন্ড আল-বারাকাহ ক্যাপিটাল — হিসাব ব্যবস্থা
   ডেটা: একই রিপোজিটরির data/fund.enc ফাইলে AES-GCM এনক্রিপ্টেড JSON।
   পড়া: যে কেউ পাসফ্রেজ জানলে। লেখা: শুধু GitHub টোকেনধারী অ্যাডমিন (সাধারণত প্রধান অর্থ কর্মকর্তা)।
   ========================================================================= */
const APP_ID = "ponchobondhu-fund";
const DATA_PATH = "data/fund.enc";
const PROOF_DIR = "data/proofs/";
const KDF_ITER = 600000;

/* ---------- Bangla helpers ---------- */
const BN_D = "০১২৩৪৫৬৭৮৯";
const bn = s => String(s).replace(/\d/g, d => BN_D[d]);
const MONTHS = ["জানুয়ারি","ফেব্রুয়ারি","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্টেম্বর","অক্টোবর","নভেম্বর","ডিসেম্বর"];
const W = ("শূন্য এক দুই তিন চার পাঁচ ছয় সাত আট নয় দশ এগারো বারো তেরো চৌদ্দ পনেরো ষোলো সতেরো আঠারো উনিশ বিশ একুশ বাইশ তেইশ চব্বিশ পঁচিশ ছাব্বিশ সাতাশ আটাশ ঊনত্রিশ ত্রিশ একত্রিশ বত্রিশ তেত্রিশ চৌত্রিশ পঁয়ত্রিশ ছত্রিশ সাঁইত্রিশ আটত্রিশ ঊনচল্লিশ চল্লিশ একচল্লিশ বিয়াল্লিশ তেতাল্লিশ চুয়াল্লিশ পঁয়তাল্লিশ ছেচল্লিশ সাতচল্লিশ আটচল্লিশ ঊনপঞ্চাশ পঞ্চাশ একান্ন বাহান্ন তিপ্পান্ন চুয়ান্ন পঞ্চান্ন ছাপ্পান্ন সাতান্ন আটান্ন ঊনষাট ষাট একষট্টি বাষট্টি তেষট্টি চৌষট্টি পঁয়ষট্টি ছেষট্টি সাতষট্টি আটষট্টি ঊনসত্তর সত্তর একাত্তর বাহাত্তর তিয়াত্তর চুয়াত্তর পঁচাত্তর ছিয়াত্তর সাতাত্তর আটাত্তর ঊনআশি আশি একাশি বিরাশি তিরাশি চুরাশি পঁচাশি ছিয়াশি সাতাশি আটাশি ঊননব্বই নব্বই একানব্বই বিরানব্বই তিরানব্বই চুরানব্বই পঁচানব্বই ছিয়ানব্বই সাতানব্বই আটানব্বই নিরানব্বই").split(" ");
function words(n){
  n = Math.round(Math.abs(n));
  if (n === 0) return "শূন্য";
  const parts = [];
  const crore = Math.floor(n / 1e7); n %= 1e7;
  if (crore) parts.push((crore < 100 ? W[crore] : words(crore)) + " কোটি");
  const lakh = Math.floor(n / 1e5); n %= 1e5;
  if (lakh) parts.push(W[lakh] + " লক্ষ");
  const th = Math.floor(n / 1000); n %= 1000;
  if (th) parts.push(W[th] + " হাজার");
  const h = Math.floor(n / 100); n %= 100;
  if (h) parts.push(W[h] + "শত");
  if (n) parts.push(W[n]);
  return parts.join(" ");
}
const tk = n => (n < 0 ? "−" : "") + "৳" + bn(Math.round(Math.abs(n || 0)).toLocaleString("en-IN"));

/* ---------- Crypto (Web Crypto: PBKDF2 → AES-GCM 256) ---------- */
const te = new TextEncoder(), td = new TextDecoder();
function b64(u8){ let s = ""; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveKey(pass, salt, iter){
  const base = await crypto.subtle.importKey("raw", te.encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]);
}
async function encBytes(key, bytes){ const iv = crypto.getRandomValues(new Uint8Array(12)); const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, bytes)); return { iv: b64(iv), ct: b64(ct) }; }
async function decBytes(key, o){ return new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(o.iv) }, key, unb64(o.ct))); }
async function exportKey(key){ return b64(new Uint8Array(await crypto.subtle.exportKey("raw", key))); }
async function importKey(raw){ return crypto.subtle.importKey("raw", unb64(raw), { name: "AES-GCM" }, true, ["encrypt", "decrypt"]); }

const GH = { owner: "", repo: "", token: "", branch: "main",
  url(p){ return `https://api.github.com/repos/${this.owner}/${this.repo}/contents/${p}`; },
  headers(accept){ const h = { Accept: accept || "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" }; if (this.token) h.Authorization = "Bearer " + this.token; return h; },
  async fail(r){ let msg = ""; try { msg = (await r.json()).message || ""; } catch (e) {} const e = new Error(msg || ("HTTP " + r.status)); e.status = r.status; e.conflict = r.status === 409 || (r.status === 422 && /sha/i.test(msg)); throw e; },
  /* returns {sha, text} or null if file missing */
  async getFile(p){
    const r = await fetch(this.url(p) + "?t=" + Date.now(), { headers: this.headers(), cache: "no-store" });
    if (r.status === 404) return null;
    if (!r.ok) await this.fail(r);
    const j = await r.json();
    if (j.content && j.encoding === "base64") return { sha: j.sha, text: atob(j.content.replace(/\s/g, "")) };
    const r2 = await fetch(this.url(p) + "?t=" + Date.now(), { headers: this.headers("application/vnd.github.raw+json"), cache: "no-store" });
    if (!r2.ok) await this.fail(r2);
    return { sha: j.sha, text: await r2.text() };
  },
  /* read-only: API first (fresh), then the Pages copy (may be a few minutes old) */
  async getText(p){
    try {
      const r = await fetch(this.url(p) + "?t=" + Date.now(), { headers: this.headers("application/vnd.github.raw+json"), cache: "no-store" });
      if (r.status === 404) return { text: null, stale: false };
      if (r.ok) return { text: await r.text(), stale: false };
    } catch (e) {}
    const r = await fetch("./" + p + "?t=" + Date.now(), { cache: "no-store" });
    if (r.status === 404) return { text: null, stale: true };
    if (!r.ok) await this.fail(r);
    return { text: await r.text(), stale: true };
  },
  async put(p, text, sha, message){
    const body = { message, content: btoa(text) }; if (sha) body.sha = sha;
    const r = await fetch(this.url(p), { method: "PUT", headers: Object.assign(this.headers(), { "Content-Type": "application/json" }), body: JSON.stringify(body) });
    if (!r.ok) await this.fail(r);
    return r.json();
  },
  async checkToken(){
    const r = await fetch(`https://api.github.com/repos/${this.owner}/${this.repo}`, { headers: this.headers(), cache: "no-store" });
    if (!r.ok) await this.fail(r);
    const j = await r.json(); this.branch = j.default_branch || "main";
    return !!(j.permissions && j.permissions.push);
  },
  historyUrl(){ return `https://github.com/${this.owner}/${this.repo}/commits/${this.branch}/${DATA_PATH}`; }
};

async function encryptData(data){
  const blob = await encBytes(KEY, te.encode(JSON.stringify(data)));
  return JSON.stringify({ app: APP_ID, v: 1, kdf: { name: "PBKDF2-SHA256", iter: KDF_ITER, salt: b64(SALT) }, iv: blob.iv, ct: blob.ct });
}
async function decryptFile(text, key){
  const f = JSON.parse(text);
  if (f.app !== APP_ID) throw new Error("এটি তহবিলের ডেটা ফাইল নয়");
  return JSON.parse(td.decode(await decBytes(key, f)));

function normalize(d){
  const e = emptyData(); for (const k of Object.keys(e)) if (d[k] === undefined) d[k] = e[k];

  if (!roles.length || roles.some(isOld)) {
    const keep = roles.filter(x => !isOld(x) && !DEFAULT_CFG.roles.some(y => y.id === x.id));
    c.roles = DEFAULT_CFG.roles.map(y => Object.assign({}, y, (roles.find(x => x.id === y.id && !isOld(x)) || {}), { id: y.id })).concat(keep);
    for (const m of d.members || []) { if (m.role === "secretary") m.role = "cao"; else if (m.role === "chair") m.role = "member"; }
  }

}

/* Load latest data. With a token we also learn the file's sha, needed to write. */
async function loadData(){
  let text, stale = false;
  if (GH.token) { const f = await GH.getFile(DATA_PATH); if (!f) return null; text = f.text; FILE_SHA = f.sha; }
  else { const r = await GH.getText(DATA_PATH); if (r.text === null) return null; text = r.text; stale = r.stale; }
  S.stale = stale; S.lastLoad = Date.now();
  return text;
}
/* Every change is one commit: apply fn to a copy, encrypt, PUT. On a conflict, reload and re-apply once. */
async function commit(message, fn){
  if (!S.canEdit) throw new Error("লিখতে হলে অ্যাডমিন লগইন লাগবে");
  for (let attempt = 0; attempt < 2; attempt++) {
    const draft = JSON.parse(JSON.stringify(D));
    fn(draft);
    const text = await encryptData(draft);
    try {
      const r = await GH.put(DATA_PATH, text, FILE_SHA, message);
      FILE_SHA = r.content.sha; D = draft; schedule(); return;
    } catch (e) {
      if (e.conflict && attempt === 0) { const t = await loadData(); if (t) D = normalize(await decryptFile(t, KEY)); continue; }
      throw e;
    }
  }
}

function invCapital(i){ const ins = S.txns.filter(t => t.type === "invest_in" && t.investId === i.id); const out = sum(S.txns.filter(t => t.type === "invest_out" && t.investId === i.id), t => t.amount); const back = sum(ins, t => t.principal); return { out, back, profit: sum(ins, t => t.profit), active: Math.max(0, out - back - (+i.writeOff || 0)) }; }
function calc(){
  const bal = { custody: 0, bankA: 0, bankB: 0 };
  for (const t of S.txns) { const f = flows(t); for (const k in f) bal[k] = (bal[k]||0) + f[k]; }
  const cash = sum(Object.keys(bal), k => bal[k]);
  const loansOut = sum(S.loans, l => loanOutstanding(l));
  const invActive = sum(S.invs, i => invCapital(i).active);
  const totalContrib = sum(contribs(), t => t.amount);
  const profit = sum(S.txns.filter(t => t.type === "invest_in"), t => t.profit);
  const writeOff = sum(S.invs, i => +i.writeOff || 0);
  const expense = sum(S.txns.filter(t => t.type === "expense"), t => t.amount);
  const ribaPending = sum(S.txns.filter(t => t.type === "riba_in"), t => t.amount) - sum(S.txns.filter(t => t.type === "riba_out"), t => t.amount);
  const netProfit = profit - writeOff - expense;
  const assets = cash + loansOut + invActive, equity = totalContrib + netProfit;

  return { bal, cash, loansOut, invActive, totalContrib, profit, writeOff, expense, ribaPending, netProfit, assets, equity, balanced: Math.abs(assets - equity - ribaPending) < 1, undeposited };

function niceStep(v){ const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; return (n < 1.5 ? 1 : n < 3.5 ? 2 : n < 7.5 ? 5 : 10) * p; }
function projectionChart(k){
  const c = cfg(), cm = curMonth(), am = activeMembers();
  const start = c.startMonth <= cm ? c.startMonth : cm, end = addMonths(cm, 36);
  const months = monthRange(start, end);
  let run = 0; const actual = [], byMonth = {};
  for (const t of contribs()) { const mm = ym(t.date || todayISO()); byMonth[mm] = (byMonth[mm]||0) + (+t.amount); }
  for (const m of monthRange(start, cm)) { run += byMonth[m] || 0; actual.push(run); }
  const proj = []; let p = k.assets - k.ribaPending; proj.push(p);
  for (const m of monthRange(addMonths(cm, 1), end)) { p += sum(am, () => rateFor(m)); proj.push(p); }
  const goals = (c.goals || []).filter(g => +g.amount > 0);
  const maxV = Math.max(1, ...actual, ...proj, ...goals.map(g => +g.amount)) * 1.08;
  const Wd = 760, H = 230, L = 60, R = 12, T = 12, B = 28;
  const x = i => L + (i / Math.max(1, months.length - 1)) * (Wd - L - R);
  const y = v => T + (1 - v / maxV) * (H - T - B);
  const step = niceStep(maxV / 4);
  let grid = "";
  for (let v = 0; v <= maxV; v += step) grid += `<line x1="${L}" x2="${Wd-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v >= 1e5 ? bn(+(v/1e5).toFixed(1)) + " লাখ" : bn(Math.round(v/1000)) + " হা."}</text>`;
  months.forEach((m, i) => { if (i % 6 === 0) grid += `<text x="${x(i)}" y="${H-8}" text-anchor="middle">${MONTHS[+m.slice(5,7)-1].slice(0,3)} ${bn(m.slice(2,4))}</text>`; });
  const ai = actual.length - 1;
  const aPath = actual.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  const area = actual.length ? aPath + `L${x(ai)},${y(0)}L${x(0)},${y(0)}Z` : "";
  const pPath = proj.map((v, i) => `${i ? "L" : "M"}${x(ai + i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  const gl = goals.map(g => `<line x1="${L}" x2="${Wd-R}" y1="${y(+g.amount)}" y2="${y(+g.amount)}" stroke="var(--gold)" stroke-dasharray="2 4"/><text x="${Wd-R}" y="${y(+g.amount)-4}" text-anchor="end" style="fill:var(--gold)">${esc(g.name)} · ${tk(g.amount)}</text>`).join("");
  return `<div class="tbl-wrap"><svg viewBox="0 0 ${Wd} ${H}" width="100%" role="img" aria-label="জমার অগ্রগতি ও ভবিষ্যৎ অনুমান">${grid}${gl}
    ${area ? `<path d="${area}" fill="var(--accent)" opacity=".12"/><path d="${aPath}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>` : ""}
    <path d="${pPath}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 5" opacity=".7"/>
    ${actual.length ? `<circle cx="${x(ai)}" cy="${y(actual[ai])}" r="4.5" fill="var(--accent)"/>` : ""}
  </svg></div><p class="small muted">গাঢ় রেখা: এ পর্যন্ত জমা হওয়া চাঁদা। ভাঙা রেখা: এখন যত সদস্য ও যে হারে দিচ্ছেন, সেভাবে চললে ৩ বছরে সম্ভাব্য তহবিল।</p>`;
}
function goalRows(k){
  const c = cfg(), am = activeMembers(), now = k.assets - k.ribaPending;
  const perMonth = sum(am, () => rateFor(addMonths(curMonth(), 1)));
  return `<div class="tbl-wrap"><table><thead><tr><th>লক্ষ্য</th><th class="r">দরকার</th><th class="r">এখন আছে</th><th class="r">শুধু চাঁদায় পৌঁছাতে</th><th class="r">আজ কিনলে জনপ্রতি এককালীন</th></tr></thead><tbody>
  ${(c.goals||[]).map(g => { const need = Math.max(0, g.amount - now); const mo = perMonth ? Math.ceil(need / perMonth) : 0; return `<tr><td>${esc(g.name)}</td><td class="r num">${tk(g.amount)}</td><td class="r num">${tk(now)}</td><td class="r">${need === 0 ? `<span class="chip c-good">পৌঁছে গেছে</span>` : perMonth ? `${bn(mo)} মাস · ${mLabel(addMonths(curMonth(), mo))}` : "—"}</td><td class="r num">${am.length ? tk(need / am.length) : "—"}</td></tr>`; }).join("") || `<tr><td colspan="5" class="muted">সেটিংসে লক্ষ্য যোগ করুন।</td></tr>`}
  </tbody></table></div>`;
}

function vCollect(){
  const c = cfg(), cm = curMonth();
  if (!S.members.length) return setupCard();
  const months = monthRange(c.startMonth, addMonths(cm, 2));
  const ms = S.members.slice().sort((a,b)=>(+a.order||0)-(+b.order||0));
  const cols = `grid-template-columns: minmax(120px,1.4fr) repeat(${months.length}, minmax(62px,1fr)) minmax(90px,1fr)`;
  const head = `<div class="grid-months small muted" style="${cols}"><div>সদস্য</div>${months.map(m => `<div style="text-align:center">${mLabel(m).replace(" ", "<br>")}</div>`).join("")}<div style="text-align:right">মোট জমা</div></div>`;
  const rows = ms.map(m => `<div class="grid-months" style="${cols};align-items:center"><div>${esc(m.name)}<div class="small muted">${esc(walletName(m.account))}</div></div>${months.map(mo => { const st = monthStatus(m, mo); const p = paidFor(m.id, mo); return `<div class="cell ${st}" title="${mLabel(mo)}: ${tk(p)}">${st === "na" ? "—" : st === "future" ? (p ? tk(p) : "·") : tk(p)}</div>`; }).join("")}<div style="text-align:right" class="num">${tk(sum(contribs().filter(t => t.memberId === m.id), t => t.amount))}</div></div>`).join("");
  const totals = `<div class="grid-months small" style="${cols};border-top:1px solid var(--line);padding-top:6px"><b>মাসের মোট</b>${months.map(mo => `<div style="text-align:center" class="num">${tk(sum(S.members, m => paidFor(m.id, mo)))}</div>`).join("")}<b style="text-align:right" class="num">${tk(sum(contribs(), t => t.amount))}</b></div>`;
  return `<section class="card">
    <div class="card-h"><h2>মাসিক চাঁদার ছক</h2><div class="row">${eb(`<button class="btn p" data-act="contrib">+ চাঁদা গ্রহণ ও রসিদ</button>`)}</div></div>
    <p class="small muted">প্রতি মাসের ${bn(c.dueDay)} তারিখের মধ্যে জমা। বর্তমান হার: ${tk(rateFor(cm))} প্রতি জন। এক রসিদে একাধিক মাসের অগ্রিমও নেওয়া যায়।</p>

    <div class="tbl-wrap"><div style="min-width:${200 + months.length * 66}px;display:flex;flex-direction:column;gap:6px">${head}${rows}${totals}</div></div>

}
function contribTable(list){
  if (!list.length) return `<div class="empty">কোনো রসিদ নেই।</div>`;
  list = list.slice().sort((a,b) => (b.date||"").localeCompare(a.date||"") || b.id.localeCompare(a.id));
  return `<div class="tbl-wrap"><table><thead><tr><th>রসিদ নং</th><th>তারিখ</th><th>সদস্য</th><th>মাস</th><th>মাধ্যম</th><th>এখন কোথায়</th><th class="r">টাকা</th><th></th></tr></thead><tbody>
  ${list.map(t => `<tr><td class="num">${esc(t.id)}</td><td class="num">${dLabel(t.date)}</td><td>${esc(mName(t.memberId))}</td><td class="small">${(t.months||[]).map(mLabel).join(", ")}</td><td class="small">${esc(METHODS[t.method] || t.method)}${t.trxId ? `<div class="muted">${esc(t.trxId)}</div>` : ""}</td><td>${whereChip(t)}</td><td class="r num">${tk(t.amount)}</td><td class="r"><button class="btn sm" data-act="receipt" data-id="${esc(t.id)}">রসিদ</button></td></tr>`).join("")}
  </tbody></table></div>`;
}
function whereChip(t){
  if (t.to !== "custody") return `<span class="chip c-info">${esc(walletName(t.to))}</span>`;
  if (t.depositId) { const d = S.txns.find(x => x.id === t.depositId); return `<span class="chip c-good">ব্যাংকে জমা${d ? " · " + esc(walletName(d.to)) : ""}</span>`; }
  return `<span class="chip c-warn">হেফাজতে</span>`;
}

function mdToHtml(t){
  const out = []; let inList = false;
  for (const line of String(t).split("\n")) {
    if (line.startsWith("- ")) { if (!inList) { out.push("<ul>"); inList = true; } out.push("<li>" + esc(line.slice(2)) + "</li>"); continue; }
    if (inList) { out.push("</ul>"); inList = false; }
    if (line.startsWith("## ")) out.push("<h2>" + esc(line.slice(3)) + "</h2>");
    else if (line.trim()) out.push("<p>" + esc(line) + "</p>");
  }
  if (inList) out.push("</ul>");
  return out.join("");
}

function errText(e){
  if (!e) return "অজানা সমস্যা";
  if (e.status === 401) return "GitHub টোকেন কাজ করছে না বা মেয়াদ শেষ। নতুন টোকেন দিয়ে আবার লগইন করুন।";
  if (e.status === 403) return "GitHub অনুমতি দেয়নি বা কিছুক্ষণের জন্য সীমা পূর্ণ। একটু পরে আবার চেষ্টা করুন।";

  return e.message || String(e);
}
async function guarded(btn, fn){
  btn.disabled = true; const old = btn.textContent; btn.textContent = "সংরক্ষণ হচ্ছে…";
  try { await fn(); } catch (e) { console.error(e); toast("সংরক্ষণ হয়নি: " + errText(e)); }
  if (btn.isConnected) { btn.disabled = false; btn.textContent = old; }
}
async function compressImage(file){
  const bmp = await createImageBitmap(file);
  const s = Math.min(1, 1400 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.8));
  return new Uint8Array(await blob.arrayBuffer());
}
/* Each proof file is encrypted and stored as its own file: data/proofs/<id>.enc */
async function uploadProofs(){
  const el = document.getElementById("f_proof"); if (!el || !el.files.length) return [];
  const out = [];
  for (const f of el.files) {
    let bytes, type = f.type || "application/octet-stream", name = f.name;
    if (type.startsWith("image/")) { bytes = await compressImage(f); type = "image/jpeg"; }
    else { if (f.size > 3 * 1024 * 1024) throw new Error(`${f.name} ৩ MB-এর বেশি বড়`); bytes = new Uint8Array(await f.arrayBuffer()); }
    const id = genId("P"), path = PROOF_DIR + id + ".enc";
    const blob = await encBytes(KEY, bytes);
    await GH.put(path, JSON.stringify({ app: APP_ID, v: 1, type, iv: blob.iv, ct: blob.ct }), null, "প্রমাণ যুক্ত: " + name);
    out.push({ id, path, name, type });
  }
  return out;
}
const proofCache = {};
async function viewProof(b){
  const path = b.dataset.path, name = b.dataset.name;
  openModal(`${dlgHead("প্রমাণ: " + esc(name))}<div class="loading">খোলা হচ্ছে…</div>`, true);
  try {
    if (!proofCache[path]) {
      const r = await GH.getText(path); if (r.text === null) throw new Error("ফাইলটি পাওয়া যায়নি");
      const o = JSON.parse(r.text);
      proofCache[path] = URL.createObjectURL(new Blob([await decBytes(KEY, o)], { type: o.type }));
    }
    const url = proofCache[path], isImg = (b.dataset.type || "").startsWith("image/");
    modal.querySelector(".dlg").innerHTML = `${dlgHead("প্রমাণ: " + esc(name))}${isImg ? `<img class="receipt-img" src="${url}" alt="প্রমাণ: ${esc(name)}">` : `<p>PDF ফাইল।</p>`}<div class="row"><a class="btn p" href="${url}" download="${esc(name)}">ডাউনলোড</a>${isImg ? "" : `<a class="btn" href="${url}" target="_blank" rel="noopener">নতুন ট্যাবে খুলুন</a>`}</div>`;
  } catch (e) { modal.querySelector(".dlg").innerHTML = `${dlgHead("প্রমাণ")}<p class="c-bad">খোলা যায়নি: ${esc(errText(e))}</p>`; }

function nextReceiptNo(date, txns){
  const pre = "R-" + date.slice(2, 4) + date.slice(5, 7) + "-";

  return pre + String((nums.length ? Math.max(...nums) : 0) + 1).padStart(3, "0");
}

  const type = btn.dataset.kind === "riba" ? val("f_type") : "expense", w = val("f_wallet");
  await guarded(btn, async () => {
    const proofs = await uploadProofs();
    const t = { id: genId("X"), type, amount, date: val("f_date"), note: val("f_note"), proofs, createdAt: nowIso() };
    if (type === "riba_in") t.to = w; else t.from = w;
    await commit(`${TYPES[type].l}: ${amount}`, d => d.txns.push(t)); closeModal(); toast("সংরক্ষিত হয়েছে।");
  });
}

  const data = { name, role: val("f_role"), phone: val("f_phone"), mfs: val("f_mfs"), account: val("f_account"), joinMonth: val("f_join"), nominee: val("f_nom"), nomineeRel: val("f_nomrel"), status: val("f_status"), order: +val("f_order") || 0 };

async function saveRepay(btn){
  const l = S.loans.find(x => x.id === btn.dataset.id), amount = +val("f_amount"), left = loanOutstanding(l);
  if (!(amount > 0)) return toast("টাকা দিন।");
  if (amount > left) return toast("বাকির চেয়ে বেশি নেওয়া যাবে না; করজে হাসানায় অতিরিক্ত কিছু নেই।");
  await guarded(btn, async () => {
    const proofs = await uploadProofs();
    await commit(`ঋণ ফেরত: ${mName(l.memberId)} ${amount}`, d => { d.txns.push({ id: genId("X"), type: "loan_repay", loanId: l.id, memberId: l.memberId, to: val("f_wallet"), amount, date: val("f_date"), note: val("f_note"), proofs, createdAt: nowIso() }); if (amount >= left) { const x = d.loans.find(y => y.id === l.id); if (x) x.status = "closed"; } });
    closeModal(); toast("কিস্তি লেখা হয়েছে।");
  });
}

async function doDelete(btn){
  const reason = val("f_reason"); if (!reason) return toast("কারণ লিখুন।");
  const t = S.txns.find(x => x.id === btn.dataset.id);
  await guarded(btn, async () => {
    await commit(`মুছে ফেলা: ${t.id} — ${reason}`, d => {
      d.audit.push({ id: genId("A"), action: "delete", at: nowIso(), reason, data: t });
      if (t.type === "transfer") for (const x of d.txns) if (x.depositId === t.id) delete x.depositId;
      d.txns = d.txns.filter(x => x.id !== t.id);
    });
    closeModal(); toast("মুছে ফেলা হয়েছে।");
  });
}

async function saveCfg(btn){

  openModal(`${dlgHead("পাসফ্রেজ বদলান")}<p class="small">কোনো সদস্য চলে গেলে বা পাসফ্রেজ ফাঁস হলে বদলান। সব ডেটা ও প্রমাণ ফাইল নতুন পাসফ্রেজে আবার এনক্রিপ্ট হবে; প্রমাণ বেশি থাকলে কয়েক মিনিট লাগতে পারে। পরে সবাইকে নতুন পাসফ্রেজ জানাতে হবে।</p><p class="small muted">মনে রাখবেন: GitHub-এর পুরোনো ইতিহাসে আগের ফাইলগুলো পুরোনো পাসফ্রেজেই খোলা যায়।</p>
  <label class="f">নতুন পাসফ্রেজ<input type="password" id="f_p1" autocomplete="new-password"></label><label class="f">আবার<input type="password" id="f_p2" autocomplete="new-password"></label>
  <div class="row"><button class="btn p" data-act="doChangePass">বদলান</button><button class="btn" data-act="close">বাতিল</button></div>`);
}
async function doChangePass(btn){
  const p1 = val("f_p1"); if (p1.length < 12) return toast("অন্তত ১২ অক্ষর দিন।"); if (p1 !== val("f_p2")) return toast("দুটি পাসফ্রেজ মিলছে না।");
  await guarded(btn, async () => {
    const oldKey = KEY, newSalt = crypto.getRandomValues(new Uint8Array(16)), newKey = await deriveKey(p1, newSalt, KDF_ITER);
    const paths = []; for (const t of S.txns.concat(S.loans, S.invs)) for (const p of (t.proofs || [])) paths.push(p.path);
    let i = 0;
    for (const path of paths) {
      btn.textContent = `প্রমাণ ${bn(++i)}/${bn(paths.length)}…`;
      const f = await GH.getFile(path); if (!f) continue;
      const o = JSON.parse(f.text); const bytes = await decBytes(oldKey, o); const e = await encBytes(newKey, bytes);
      await GH.put(path, JSON.stringify({ app: APP_ID, v: 1, type: o.type, iv: e.iv, ct: e.ct }), f.sha, "পাসফ্রেজ পরিবর্তন: প্রমাণ");
    }
    KEY = newKey; SALT = newSalt;
    await commit("পাসফ্রেজ পরিবর্তন", () => {});
    if (LS.get(lsKey("key"))) LS.set(lsKey("key"), JSON.stringify({ salt: b64(SALT), key: await exportKey(KEY) }));
    closeModal(); toast("পাসফ্রেজ বদলানো হয়েছে। সবাইকে নতুনটা জানান।");
  });
}

/* ---------- Events ---------- */
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, id = b.dataset.id;
  if (b.tagName === "BUTTON" || b.getAttribute("href") === "#") e.preventDefault();
  const writes = ["contrib","transfer","expense","riba","member","loan","repay","invest","invout","invin","invclose","decision","bylaws","del","addproof","savecfg","import","chpass","deldec"];
  if (writes.includes(a) && !S.canEdit) return toast("এ কাজের জন্য অ্যাডমিন লগইন লাগবে।");
  switch (a) {
    case "close": closeModal(); break;
    case "more": openModal(`${dlgHead("মেনু")}<div class="more-sheet">${TABS.map(([k,l]) => `<a href="#${k}" data-act="close" ${k===TAB?'aria-current="page"':""}>${l}</a>`).join("")}</div>
      <div class="more-sheet" style="margin-top:6px"><button data-act="refresh">↻ রিফ্রেশ</button>${S.canEdit ? `<button data-act="logout">অ্যাডমিন লগআউট</button>` : `<button data-act="login">অ্যাডমিন লগইন</button>`}<button data-act="lock">🔒 লক করুন</button></div>
      <p class="small muted" style="margin:4px 0 0">${S.canEdit ? "আপনি অ্যাডমিন হিসেবে লগইন করা আছেন।" : "আপনি সদস্য হিসেবে শুধু দেখতে পারছেন।"}</p>`); break;
    case "retry": boot(); break;
    case "saveRepo": { const r = val("u_repo").replace(/^https?:\/\/github\.com\//, "").replace(/\/$/, ""); if (!/^[\w.-]+\/[\w.-]+$/.test(r)) return toast("ইউজারনেম/রিপো আকারে লিখুন।"); LS.set("fund.repo", r); boot(); break; }
    case "changeRepo": LS.del("fund.repo"); S.phase = "norepo"; render(); break;
    case "login": formLogin(); break;
    case "doLogin": doLogin(b); break;
    case "logout": LS.del(lsKey("token")); GH.token = ""; S.canEdit = false; toast("লগআউট হয়েছে।"); render(); break;
    case "lock": LS.del(lsKey("key")); KEY = null; D = null; S.phase = "locked"; S.msg = ""; render(); break;
    case "refresh": await refresh(true); toast("সর্বশেষ তথ্য আনা হয়েছে।"); break;
    case "contrib": formContrib(b.dataset.member); break;
    case "saveContrib": saveContrib(b); break;
    case "transfer": formTransfer(); break;
    case "saveTransfer": saveTransfer(b); break;
    case "expense": formSimple("expense"); break;
    case "riba": formSimple("riba"); break;
    case "saveSimple": saveSimple(b); break;
    case "member": formMember(id); break;
    case "saveMember": saveMember(b); break;
    case "loan": formLoan(); break;
    case "saveLoan": saveLoan(b); break;
    case "repay": formRepay(id); break;
    case "saveRepay": saveRepay(b); break;
    case "invest": formInvest(); break;
    case "saveInvest": saveInvest(b); break;
    case "invout": formInvMove(id, "out"); break;
    case "invin": formInvMove(id, "in"); break;
    case "saveInvMove": saveInvMove(b); break;
    case "invclose": formInvClose(id); break;
    case "saveInvClose": saveInvClose(b); break;
    case "decision": formDecision(); break;
    case "saveDecision": saveDecision(b); break;
    case "deldec": formConfirm("সিদ্ধান্ত মুছবেন?", "এই সিদ্ধান্তের রেকর্ড মুছে যাবে (GitHub-এর ইতিহাসে থেকে যাবে)।", "doDelDec", id); break;
    case "doDelDec": guarded(b, async () => { await commit("সিদ্ধান্ত মুছে ফেলা", d => { d.decisions = d.decisions.filter(x => x.id !== id); }); closeModal(); toast("মুছে ফেলা হয়েছে।"); }); break;
    case "bylaws": formBylaws(); break;
    case "saveBylaws": { const text = document.getElementById("f_text").value; guarded(b, async () => { await commit("নীতিমালা হালনাগাদ", d => { d.bylaws = { text, updatedAt: nowIso() }; }); closeModal(); toast("নীতিমালা সংরক্ষিত।"); }); break; }
    case "del": formDelete(id); break;
    case "doDelete": doDelete(b); break;
    case "addproof": formAddProof(id); break;
    case "saveProof": saveProof(b); break;
    case "savecfg": saveCfg(b); break;
    case "receipt": showReceipt(id); break;
    case "sharereceipt": shareReceipt(id); break;
    case "copyreceipt": copyText(receiptText(S.txns.find(x => x.id === id))); break;
    case "report": copyText(monthlyReport()); break;
    case "statement": memberStatement(id); break;
    case "export": exportMenu(); break;
    case "dljson": download(`তহবিল-ব্যাকআপ-${todayISO()}.json`, JSON.stringify(Object.assign({ exportedAt: nowIso() }, D), null, 2), "application/json"); break;
    case "dlcsv": download(`খতিয়ান-${todayISO()}.csv`, csv(), "text/csv"); break;
    case "import": formImport(); break;
    case "doImport": doImport(b); break;
    case "chpass": formChangePass(); break;
    case "doChangePass": doChangePass(b); break;
    case "viewproof": viewProof(b); break;
  }
});
document.addEventListener("change", e => { if (["fType","fMember","fWallet"].includes(e.target.id)) { S.ui[e.target.id] = e.target.value; render(); } });
document.addEventListener("submit", async e => {
  e.preventDefault();
  const btn = e.target.querySelector("button[type=submit]");
  if (e.target.id === "unlockForm") {
    const pass = val("u_pass"); if (!pass) return;
    btn.disabled = true; btn.textContent = "খোলা হচ্ছে…";
    try { await unlock(pass, document.getElementById("u_remember").checked); }
    catch (err) { S.msg = err.name === "OperationError" ? "পাসফ্রেজ ঠিক নয়।" : errText(err); render(); }
  }
  if (e.target.id === "setupForm") {
    const p1 = val("u_pass"), p2 = val("u_pass2");
    if (p1.length < 12) { S.msg = "পাসফ্রেজ অন্তত ১২ অক্ষরের দিন।"; return render(); }
    if (p1 !== p2) { S.msg = "দুটি পাসফ্রেজ মিলছে না।"; return render(); }
    btn.disabled = true; btn.textContent = "তৈরি হচ্ছে…";
    try {
      SALT = crypto.getRandomValues(new Uint8Array(16)); KEY = await deriveKey(p1, SALT, KDF_ITER);
      const d = emptyData(); d.cfg.groupName = val("u_name") || d.cfg.groupName; d.cfg.managerName = val("u_mgr");
      const mgr = val("u_mgr"); if (mgr) d.members.push({ id: genId("M"), name: mgr, role: "cfo", account: "bankA", joinMonth: d.cfg.startMonth, status: "active", order: 1, createdAt: nowIso() });
      const r = await GH.put(DATA_PATH, await encryptData(d), null, "তহবিল তৈরি");
      FILE_SHA = r.content.sha; D = d; S.msg = "";
      LS.set(lsKey("key"), JSON.stringify({ salt: b64(SALT), key: await exportKey(KEY) }));
      S.phase = "ready"; TAB = "members"; history.replaceState(null, "", "#members"); render();
    } catch (err) { S.msg = errText(err); render(); }
  }
});
function route(){
  const h = location.hash.slice(1);
  if (h.startsWith("rcpt-")) { if (S.phase === "ready") showReceipt(h.slice(5)); return; }
  TAB = TABS.some(t => t[0] === h) ? h : "overview";
  render(); window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.phase === "ready" && Date.now() - S.lastLoad > 120000 && !modal.classList.contains("open")) refresh(false).catch(() => {}); });

/* ---------- Boot / unlock ---------- */
let FILE_TEXT = null;
async function unlock(pass, remember){
  const f = JSON.parse(FILE_TEXT);
  const salt = unb64(f.kdf.salt);
  const key = await deriveKey(pass, salt, f.kdf.iter || KDF_ITER);
  D = normalize(await decryptFile(FILE_TEXT, key));
  KEY = key; SALT = salt; S.msg = "";
  if (remember) LS.set(lsKey("key"), JSON.stringify({ salt: f.kdf.salt, key: await exportKey(key) }));
  afterUnlock();
}
function afterUnlock(){
  S.phase = "ready";
  const h = location.hash.slice(1);
  if (h.startsWith("rcpt-")) { render(); showReceipt(h.slice(5)); } else route();
}
async function refresh(loud){
  try {
    const text = await loadData();
    if (!text) return;
    FILE_TEXT = text;
    const f = JSON.parse(text);
    if (b64(SALT) !== f.kdf.salt) { LS.del(lsKey("key")); KEY = null; S.phase = "locked"; S.msg = "পাসফ্রেজ বদলানো হয়েছে। নতুন পাসফ্রেজ দিন।"; render(); return; }
    D = normalize(await decryptFile(text, KEY)); render();
  } catch (e) { if (loud) toast("রিফ্রেশ হয়নি: " + errText(e)); }
}
async function boot(){
  S.phase = "boot"; S.msg = "সংযোগ হচ্ছে…"; render();
  if (!window.crypto || !crypto.subtle) { S.phase = "error"; S.msg = "এই ব্রাউজারে নিরাপদ এনক্রিপশন চলে না। https লিংকে, Chrome বা অন্য আধুনিক ব্রাউজারে খুলুন।"; return render(); }
  if (!detectRepo()) { S.phase = "norepo"; return render(); }
  GH.token = LS.get(lsKey("token")) || "";
  S.canEdit = !!GH.token;
  try {
    if (GH.token) { try { S.canEdit = await GH.checkToken(); } catch (e) { if (e.status === 401) { LS.del(lsKey("token")); GH.token = ""; S.canEdit = false; toast("সংরক্ষিত টোকেনের মেয়াদ শেষ; আবার অ্যাডমিন লগইন করুন।"); } else throw e; } }
    S.msg = "হিসাব আনা হচ্ছে…"; render();
    const text = await loadData();
    if (!text) { S.phase = "nodata"; S.msg = ""; return render(); }
    FILE_TEXT = text;
    const saved = LS.get(lsKey("key"));
    if (saved) {
      try {
        const o = JSON.parse(saved), f = JSON.parse(text);
        if (o.salt === f.kdf.salt) { KEY = await importKey(o.key); SALT = unb64(o.salt); D = normalize(await decryptFile(text, KEY)); afterUnlock(); return; }
      } catch (e) { /* fall through to passphrase */ }
      LS.del(lsKey("key"));
    }
    S.phase = "locked"; S.msg = ""; render();
  } catch (e) { S.phase = "error"; S.msg = errText(e); render(); }
}
boot();
</script>
